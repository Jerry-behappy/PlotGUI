name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python Tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r python/requirements.txt
      - name: Test numerical behavior and GUI updates
        run: python -m unittest discover -s tests -v
      - name: Open and close the GUI
        run: python python/plot_gui.py --gui-smoke-test
